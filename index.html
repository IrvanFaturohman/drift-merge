<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1B232C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Drift Merge</title>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <button type="button" class="sound-btn no-boost" id="sound-btn" aria-label="Mute sound">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" />
            <path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
          </svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" />
            <path d="M16 9.5l5 5M21 9.5l-5 5" />
          </svg>
        </button>
        <div class="money" id="money">
          <span class="coin" aria-hidden="true">$</span>
          <span class="money-value" id="money-value">$0</span>
        </div>
        <div class="hud-row">
          <div class="chip no-boost" id="circuit-chip">
            <span class="chip-label">CIRCUIT</span>
            <span class="chip-value" id="circuit-level">1</span>
            <span class="chip-mult" id="circuit-mult">x1</span>
          </div>
          <div class="nos" id="nos">
            <span class="nos-label">NOS</span>
            <div class="nos-bar"><div class="nos-fill" id="nos-fill"></div></div>
            <span class="nos-mult" id="nos-mult">1.00x</span>
          </div>
          <div class="chip">
            <span class="chip-label">CARS</span>
            <span class="chip-value" id="car-count">1/8</span>
          </div>
        </div>
      </header>

      <main class="play-area" id="play-area">
        <canvas id="game-canvas"></canvas>
        <div class="tap-hint" id="tap-hint">TAP ANYWHERE FOR NOS</div>
      </main>

      <footer class="controls">
        <button type="button" class="btn btn-merge no-boost" data-action="merge">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3v3c0 4 6 5 6 9v6M18 3v3c0 4-6 5-6 9" />
            <path d="M8.5 17.5 12 21l3.5-3.5" />
          </svg>
          <span class="btn-text">
            <span class="btn-title">MERGE</span>
            <span class="btn-sub">NO PAIR</span>
          </span>
        </button>
        <button type="button" class="btn btn-car no-boost" data-action="addCar">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 16.5v-3.5l2.5-5h13l2.5 5v3.5z" />
            <circle cx="7.5" cy="17" r="2" />
            <circle cx="16.5" cy="17" r="2" />
          </svg>
          <span class="btn-text">
            <span class="btn-title">ADD CAR</span>
            <span class="btn-sub">$10</span>
          </span>
        </button>
        <button type="button" class="btn btn-line no-boost" data-action="addLine">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 21V4M5 4h13l-3 4 3 4H5" />
          </svg>
          <span class="btn-text">
            <span class="btn-title">ADD REWARD LINE</span>
            <span class="btn-sub">$50</span>
          </span>
          <span class="btn-badge">1/4</span>
        </button>
        <button type="button" class="btn btn-upgrade no-boost" data-action="upgrade">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 13l6-6 6 6M6 20l6-6 6 6" />
          </svg>
          <span class="btn-text">
            <span class="btn-title">UPGRADE CIRCUIT</span>
            <span class="btn-sub">$250</span>
          </span>
          <span class="btn-badge">x1.5</span>
        </button>
      </footer>

      <canvas id="fx-canvas" aria-hidden="true"></canvas>

      <aside class="debug no-boost" id="debug" hidden>
        <div class="debug-head">
          DEBUG <span>(D to close)</span>
          <button type="button" class="debug-close" data-debug="close" aria-label="Close debug panel">×</button>
        </div>
        <pre id="debug-stats"></pre>
        <div class="debug-actions">
          <button type="button" data-debug="money100">+100 Money</button>
          <button type="button" data-debug="money1000">+1000 Money</button>
          <button type="button" data-debug="money10000">+10000 Money</button>
          <button type="button" data-debug="spawn">Spawn T1 Car</button>
          <button type="button" data-debug="circuit">Next Circuit</button>
          <button type="button" data-debug="reset" class="danger">Reset Save</button>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
